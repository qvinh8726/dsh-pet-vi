# Bản Windows độc lập; không cần Node.js hay DeepSeek Harness trên máy người dùng.
appId: io.github.qvinh8726.dsh-pet-vi
productName: DSH Pet Việt
copyright: Copyright © 2026 PC2005-cloud; bản Việt hóa qvinh8726

directories:
  output: dist-app

extraMetadata:
  main: lib/app.js

files:
  - lib/**
  - runtime/**
  - assets/webm/**
  - assets/fonts/**
  - assets/pic/**
  - assets/memes/**
  - assets/sound/**
  - assets/config.jsonc
  - assets/logo.png
  - assets/main-character.png
  - package.json
  - LICENSE
  - '!node_modules/**'

extraFiles:
  - from: ../README.md
    to: HUONG-DAN.md
  - from: ../LICENSE
    to: GIAY-PHEP-MA-NGUON.txt
  - from: ../NOTICE.md
    to: GHI-CONG-VA-BAN-QUYEN.md

asar: true
npmRebuild: false
electronVersion: 43.3.0

win:
  icon: assets/logo.png
  executableName: dsh-pet-vi
  target:
    - target: nsis
      arch: [x64]
  signAndEditExecutable: true
  artifactName: DSH-Pet-Viet-${version}-Windows-${arch}-Setup.${ext}

nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DSH Pet Việt
  uninstallDisplayName: DSH Pet Việt
  deleteAppDataOnUninstall: false
  packElevateHelper: false
  differentialPackage: false
  installerLanguages: [vi_VN]
  language: '1066'
  include: scripts/installer-vi.nsh
