# Tái tạo và kiểm tra gói Windows từ tag; không ghi đè tài sản đã phát hành.
name: release-app

on:
  push:
    tags: ['v*-vi']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag bản Việt cần build (ví dụ v1.0.0-vi)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-app-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dsh-pet
    steps:
      - name: Lấy mã nguồn của tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cài pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Cài phụ thuộc theo lockfile
        run: pnpm install --frozen-lockfile
      - name: Kiểm tra tag khớp phiên bản
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "Tag $env:TAG không khớp v$version" }
      - name: Kiểm tra kiểu, mã nguồn và định dạng
        run: |
          npm run typecheck
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:cycles
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:runtime
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run format:check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check:openapi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Chạy toàn bộ kiểm thử Node
        run: npm test
      - name: Cài Chromium cho kiểm thử giao diện
        run: pnpm exec playwright install chromium
      - name: Chạy toàn bộ kiểm thử giao diện và runtime
        run: npm run test:ui
      - name: Build đầy đủ và kiểm tra tài nguyên
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/prepack-check.js
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Tạo bộ cài Windows x64
        env:
          DSH_PET_ALLOW_ELECTRON_DOWNLOAD: '1'
        run: npm run dist
      - name: Tạo ZIP và mã SHA-256
        run: node scripts/package-release.mjs
      - name: Lưu gói đã build
        uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-vi-windows-x64
          path: |
            dsh-pet/dist-app/DSH-Pet-Viet-*-Setup.exe
            dsh-pet/dist-app/DSH-Pet-Viet-*.zip
            dsh-pet/dist-app/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Lấy gói đã kiểm tra
        uses: actions/download-artifact@v4
        with:
          name: dsh-pet-vi-windows-x64
          path: release-assets
      - name: Đính kèm nếu Release đã có và chưa có gói cục bộ
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Chưa có Release; gói đã được lưu trong Actions để người duy trì kiểm tra và phát hành.'
            exit 0
          fi
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          if printf '%s\n' "$existing" | grep -Eq '(Setup\.exe|\.zip|SHA256SUMS\.txt)$'; then
            echo 'Release đã có gói; giữ nguyên gói và mã băm đã được người duy trì kiểm chứng.'
            exit 0
          fi
          gh release upload "$TAG" release-assets/*
